<header>
  <nav class="navbar">
    <div class="nav-brand">
      <button
        type="button"
        class="hamburger"
        [class.abierto]="menuAbierto"
        (click)="menuAbierto = !menuAbierto"
        aria-label="Menú de navegación">
        <span class="barra"></span>
        <span class="barra"></span>
        <span class="barra"></span>
      </button>
      <a routerLink="/" class="brand-link">
        <img *ngIf="!esHome" src="images/Logo2.png" alt="Spa Relax" class="navbar-logo" />
        <span class="brand-text">Spa <span class="brand-accent">Relax</span></span>
      </a>
    </div>

    <!-- Links con sesión -->
    <div class="nav-links" [class.abierto]="menuAbierto" *ngIf="sesion$ | async as sesion">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}" (click)="cerrarMenu()">Inicio</a>
      <a routerLink="/servicios" routerLinkActive="activo" (click)="cerrarMenu()">Servicios</a>
      <a routerLink="/profesionales" routerLinkActive="activo" (click)="cerrarMenu()">Profesionales</a>
      <a routerLink="/horarios" routerLinkActive="activo" (click)="cerrarMenu()">Horarios</a>
      <a routerLink="/mis-citas" routerLinkActive="activo" (click)="cerrarMenu()">Mis citas</a>

      <ng-container *ngIf="sesion.rol === 'ADMIN'">
        <span class="separador desktop-only">|</span>
        <a routerLink="/admin/servicios" routerLinkActive="activo" (click)="cerrarMenu()">Admin Servicios</a>
        <a routerLink="/admin/profesionales" routerLinkActive="activo" (click)="cerrarMenu()">Admin Profesionales</a>
        <a routerLink="/admin/horarios" routerLinkActive="activo" (click)="cerrarMenu()">Admin Horarios</a>
        <a routerLink="/admin/citas" routerLinkActive="activo" (click)="cerrarMenu()">Admin Citas</a>
        <a routerLink="/admin/usuarios" routerLinkActive="activo" (click)="cerrarMenu()">Admin Usuarios</a>
      </ng-container>

      <div class="nav-user">
        <span class="user-name">{{ sesion.nombre }}</span>
        <button type="button" class="btn-logout" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>

    <!-- Links sin sesión -->
    <div class="nav-links" [class.abierto]="menuAbierto" *ngIf="!(sesion$ | async)">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}" (click)="cerrarMenu()">Inicio</a>
      <a routerLink="/servicios" routerLinkActive="activo" (click)="cerrarMenu()">Servicios</a>
      <a routerLink="/profesionales" routerLinkActive="activo" (click)="cerrarMenu()">Profesionales</a>
      <a routerLink="/horarios" routerLinkActive="activo" (click)="cerrarMenu()">Horarios</a>

      <div class="nav-user">
        <a routerLink="/login" routerLinkActive="activo" (click)="cerrarMenu()">Iniciar sesión</a>
        <a routerLink="/registro" routerLinkActive="activo" class="btn-register" (click)="cerrarMenu()">Registrarse</a>
      </div>
    </div>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
