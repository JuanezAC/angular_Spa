<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon error">
        <i data-lucide="shield-off"></i>
      </div>
      <h2>Sin permisos</h2>
      <p class="auth-subtitle">No tienes permisos para acceder a esta sección</p>
    </div>

    <div class="auth-body centered">
      <p class="help-text">
        Si crees que esto es un error, contacta al administrador del sistema.
      </p>

      <button type="button" class="btn btn-primary" (click)="volver()">
        <i data-lucide="arrow-left"></i>
        Volver al inicio
      </button>
    </div>
  </div>
</div>
