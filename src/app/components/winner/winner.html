<section class="winner-page">
  <div class="winner-card" *ngIf="valido && winner">
    <div class="winner-icon">
      <i data-lucide="trophy"></i>
    </div>

    <span class="winner-badge">Ganador #{{ winner.numero }}</span>

    <h1 class="winner-title">{{ winner.titulo }}</h1>
    <h2 class="winner-subtitle">{{ winner.subtitulo }}</h2>

    <p class="winner-message">{{ winner.mensaje }}</p>

    <div class="winner-divider"></div>

    <p class="winner-footer-text">Spa Relax — Tu momento de paz comienza aquí</p>

    <a routerLink="/" class="btn btn-primary btn-lg winner-btn">
      <i data-lucide="home"></i>
      Volver a Spa Relax
    </a>
  </div>

  <div class="winner-card winner-not-found" *ngIf="!valido">
    <div class="winner-icon winner-icon-error">
      <i data-lucide="circle-x"></i>
    </div>

    <h1 class="winner-title">Ganador no encontrado</h1>
    <p class="winner-message">Este ganador no existe o aún no ha sido revelado.</p>

    <a routerLink="/" class="btn btn-primary btn-lg winner-btn">
      <i data-lucide="home"></i>
      Volver a Spa Relax
    </a>
  </div>
</section>
