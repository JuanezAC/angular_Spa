<div class="admin-page">
  <div class="page-header">
    <h1>GestiÃ³n de Profesionales</h1>
    <div class="header-actions">
      <input [(ngModel)]="textoFiltro" placeholder="Buscar por nombre, especialidad o correo" class="search-input" />
      <button type="button" (click)="abrirModalCrear()" class="btn btn-primary">
        <i data-lucide="plus"></i> Crear nuevo
      </button>
    </div>
  </div>

  <div *ngIf="estado$ | async as estado">
    <div *ngIf="estado.loading" class="loading-state">
      <div class="spinner"></div>
      <p>Cargando profesionales...</p>
    </div>
    <div *ngIf="estado.error" class="error-state">
      <i data-lucide="alert-circle"></i>
      <p>{{ estado.error }}</p>
    </div>
    <div *ngIf="!estado.loading && !estado.error && filtrar(estado.data).length === 0" class="empty-state">
      <i data-lucide="users"></i>
      <p>No hay profesionales registrados.</p>
    </div>

    <div class="cards-grid" *ngIf="!estado.loading && !estado.error && filtrar(estado.data).length > 0">
      <div class="entity-card" *ngFor="let p of filtrar(estado.data)">
        <div class="card-image">
          <img *ngIf="p.imagenUrl" [src]="p.imagenUrl" (error)="p.imagenUrl = ''" [alt]="p.nombre" />
          <div *ngIf="!p.imagenUrl" class="card-image-placeholder">
            <i data-lucide="user"></i>
          </div>
          <span class="card-badge" [class.badge-success]="p.estado" [class.badge-neutral]="!p.estado">
            {{ p.estado ? 'Activo' : 'Inactivo' }}
          </span>
        </div>
        <div class="card-body">
          <h3 class="card-title">{{ p.nombre }}</h3>
          <p class="card-specialty">{{ p.especialidad }}</p>
          <div class="card-contact">
            <span class="contact-item"><i data-lucide="mail"></i> {{ p.correo }}</span>
            <span class="contact-item"><i data-lucide="phone"></i> {{ p.telefono }}</span>
          </div>
        </div>
        <div class="card-actions">
          <button type="button" (click)="abrirModalEditar(p)" class="btn btn-ghost btn-sm">
            <i data-lucide="pencil"></i> Editar
          </button>
          <button type="button" (click)="eliminar(p)" class="btn btn-danger btn-sm">
            <i data-lucide="trash-2"></i> Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL CREAR -->
<div *ngIf="modalCrearAbierto" class="overlay" (click)="cerrarModalCrear()">
  <div class="modal" (click)="$event.stopPropagation()">
    <app-admin-profesionales-crear
      (profesionalCreado)="recargarLista(); cerrarModalCrear()"
      (cancelar)="cerrarModalCrear()">
    </app-admin-profesionales-crear>
  </div>
</div>

<!-- MODAL EDITAR -->
<div *ngIf="modalEditarAbierto" class="overlay" (click)="cerrarModalEditar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <app-admin-profesionales-editar
      [profesional]="profesionalSeleccionado"
      (profesionalEditado)="recargarLista(); cerrarModalEditar()"
      (cancelar)="cerrarModalEditar()">
    </app-admin-profesionales-editar>
  </div>
</div>
