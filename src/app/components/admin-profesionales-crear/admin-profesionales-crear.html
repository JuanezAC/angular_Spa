<div class="form-panel">
  <div class="form-header">
    <h2>Crear Profesional</h2>
    <p class="form-subtitle">Registra un nuevo miembro del equipo</p>
  </div>

  <form (ngSubmit)="guardarProfesional()" class="form-body">
    <div class="form-section">
      <h3 class="section-label">Informacion personal</h3>

      <div class="form-group">
        <label class="form-label" for="nombre">Nombre <span class="required">*</span></label>
        <input id="nombre" name="nombre" class="form-input" [(ngModel)]="profesionalNuevo.nombre" placeholder="Nombre completo" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="especialidad">Especialidad <span class="required">*</span></label>
        <input id="especialidad" name="especialidad" class="form-input" [(ngModel)]="profesionalNuevo.especialidad" placeholder="Ej: Masajista terapeutico" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="correo">Correo <span class="required">*</span></label>
          <input id="correo" name="correo" type="email" class="form-input" [(ngModel)]="profesionalNuevo.correo" placeholder="correo@ejemplo.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="telefono">Telefono <span class="required">*</span></label>
          <input id="telefono" name="telefono" class="form-input" [(ngModel)]="profesionalNuevo.telefono" pattern="[0-9]+" inputmode="numeric" placeholder="Solo numeros" required (input)="profesionalNuevo.telefono = profesionalNuevo.telefono.replace(/[^0-9]/g, '')" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Estado</label>
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="profesionalNuevo.estado" name="estado" class="toggle-input" />
          <span class="toggle-switch"></span>
          <span class="toggle-text">{{ profesionalNuevo.estado ? 'Activo' : 'Inactivo' }}</span>
        </label>
      </div>
    </div>

    <div class="form-section">
      <h3 class="section-label">Foto del profesional</h3>

      <div class="form-group">
        <label class="form-label" for="imagenUrl">URL de imagen (opcional)</label>
        <input id="imagenUrl" name="imagenUrl" type="url" class="form-input" [(ngModel)]="profesionalNuevo.imagenUrl" placeholder="https://ejemplo.com/foto.jpg" (ngModelChange)="onImagenUrlChange()" />
        <p class="form-hint">URL de la foto de perfil del profesional</p>
      </div>

      <div class="image-preview-area" *ngIf="profesionalNuevo.imagenUrl && !imagenError">
        <img [src]="profesionalNuevo.imagenUrl" (error)="imagenError = true" alt="Vista previa" class="preview-img" />
        <span class="preview-label">Vista previa</span>
      </div>

      <div class="image-preview-placeholder" *ngIf="!profesionalNuevo.imagenUrl || imagenError">
        <i data-lucide="user"></i>
        <span>Sin foto</span>
      </div>
    </div>

    <div class="form-section">
      <h3 class="section-label">Servicios asignados</h3>

      <div class="services-checklist">
        <label *ngFor="let s of serviciosDisponibles" class="check-item">
          <input type="checkbox" [checked]="serviciosSeleccionados.includes(s.id!)" (change)="toggleServicio(s.id!)" class="check-input" />
          <span class="check-text">{{ s.nombre }} <span class="check-meta">({{ s.duracion }} min)</span></span>
        </label>
        <p class="form-hint" *ngIf="serviciosDisponibles.length === 0">No hay servicios disponibles</p>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-ghost" (click)="cerrar()">
        <i data-lucide="x"></i> Cancelar
      </button>
      <button type="submit" class="btn btn-primary">
        <i data-lucide="plus"></i> Crear profesional
      </button>
    </div>
  </form>
</div>
