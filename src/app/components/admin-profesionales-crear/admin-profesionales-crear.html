<h2>Crear Profesional</h2>
<form (ngSubmit)="guardarProfesional()">
  <div class="campo"><label>Nombre</label><input name="nombre" [(ngModel)]="profesionalNuevo.nombre" required /></div>
  <div class="campo"><label>Especialidad</label><input name="especialidad" [(ngModel)]="profesionalNuevo.especialidad" required /></div>
  <div class="campo"><label>Correo</label><input name="correo" type="email" [(ngModel)]="profesionalNuevo.correo" required /></div>
  <div class="campo"><label>Teléfono</label><input name="telefono" [(ngModel)]="profesionalNuevo.telefono" pattern="[0-9]+" inputmode="numeric" required (input)="profesionalNuevo.telefono = profesionalNuevo.telefono.replace(/[^0-9]/g, '')" /></div>
  <div class="campo"><label>URL de imagen (opcional)</label><input name="imagenUrl" type="url" [(ngModel)]="profesionalNuevo.imagenUrl" placeholder="https://ejemplo.com/foto.jpg" />
    <div *ngIf="profesionalNuevo.imagenUrl" class="imagen-preview">
      <img [src]="profesionalNuevo.imagenUrl" (error)="profesionalNuevo.imagenUrl = ''" alt="Vista previa" />
    </div>
  </div>
  <div class="campo checkbox">
    <label><input type="checkbox" [(ngModel)]="profesionalNuevo.estado" name="estado" /> Activo</label>
  </div>

  <!-- ✅ LISTA DE SERVICIOS -->
  <div class="campo">
    <label>Servicios asignados</label>
    <div class="servicios-lista">
      <label *ngFor="let s of serviciosDisponibles" class="servicio-item">
        <input type="checkbox" [checked]="serviciosSeleccionados.includes(s.id!)" (change)="toggleServicio(s.id!)">
        <span>{{ s.nombre }} ({{ s.duracion }} min)</span>
      </label>
    </div>
  </div>

  <div class="acciones">
    <button type="submit">Guardar</button>
    <button type="button" (click)="cerrar()">Cancelar</button>
  </div>
</form>
