<div class="form-panel">
  <div class="form-header">
    <h2>Editar Usuario</h2>
    <p class="form-subtitle">Actualiza la información del usuario</p>
  </div>

  <form (ngSubmit)="guardarCambios()" class="form-body">
    <div class="form-section">
      <div class="form-group">
        <label class="form-label">Nombre <span class="required">*</span></label>
        <input name="nombre" [(ngModel)]="usuarioEditando.nombre" class="form-input" maxlength="13" required />
      </div>

      <div class="form-group">
        <label class="form-label">Correo <span class="required">*</span></label>
        <input name="correo" type="email" [(ngModel)]="usuarioEditando.correo" class="form-input" required />
      </div>

      <div class="form-group">
        <label class="form-label">Nueva Contraseña</label>
        <input name="contrasena" type="password" [(ngModel)]="contrasenaNueva" class="form-input" />
        <p class="form-hint">Dejar vacío para mantener la actual</p>
      </div>

      <div class="form-group">
        <label class="form-label">Rol <span class="required">*</span></label>
        <select name="rol" [(ngModel)]="usuarioEditando.rol" class="form-select" required>
          <option value="CLIENTE">Cliente</option>
          <option value="ADMIN">Administrador</option>
          <option value="PROFESIONAL">Profesional</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-ghost" (click)="cerrar()">
        <i data-lucide="x"></i> Cancelar
      </button>
      <button type="submit" class="btn btn-primary">
        <i data-lucide="save"></i> Actualizar
      </button>
    </div>
  </form>
</div>
