<div class="modal-content">
  <h2>Editar Servicio</h2>
  <form (ngSubmit)="guardarCambios()">
    <div class="campo">
      <label>Nombre</label>
      <input name="nombre" [(ngModel)]="servicioEditando.nombre" required />
    </div>
    <div class="campo">
      <label>Descripción</label>
      <input name="descripcion" [(ngModel)]="servicioEditando.descripcion" />
    </div>
    <div class="campo">
      <label>Duración (min)</label>
      <input name="duracion" type="number" [(ngModel)]="servicioEditando.duracion" required />
    </div>
    <div class="campo">
      <label>Precio</label>
      <input name="precio" type="number" [(ngModel)]="servicioEditando.precio" step="0.01" required />
    </div>
    <div class="campo">
      <label>URL de imagen (opcional)</label>
      <input name="imagenUrl" type="url" [(ngModel)]="servicioEditando.imagenUrl" placeholder="https://ejemplo.com/imagen.jpg" />
      <div *ngIf="servicioEditando.imagenUrl" class="imagen-preview">
        <img [src]="servicioEditando.imagenUrl" (error)="servicioEditando.imagenUrl = ''" alt="Vista previa" />
      </div>
    </div>
    <div class="acciones">
      <button type="submit">Actualizar</button>
      <button type="button" (click)="cerrar()">Cancelar</button>
    </div>
  </form>
</div>
