<div class="admin-page">
  <div class="page-header">
    <h1>Gestión de Servicios</h1>
    <div class="header-actions">
      <input [(ngModel)]="textoFiltro" placeholder="Buscar por nombre o descripción" class="search-input" />
      <button type="button" (click)="abrirModalCrear()" class="btn btn-primary">
        <i data-lucide="plus"></i> Crear nuevo
      </button>
    </div>
  </div>

  <div *ngIf="estado$ | async as estado">
    <div *ngIf="estado.loading" class="loading-state">
      <div class="spinner"></div>
      <p>Cargando servicios...</p>
    </div>
    <div *ngIf="estado.error" class="error-state">
      <i data-lucide="alert-circle"></i>
      <p>{{ estado.error }}</p>
    </div>

    <div *ngIf="!estado.loading && !estado.error && filtrar(estado.data).length === 0" class="empty-state">
      <i data-lucide="sparkles"></i>
      <p>No hay servicios registrados.</p>
    </div>

    <div class="cards-grid" *ngIf="!estado.loading && !estado.error && filtrar(estado.data).length > 0">
      <div class="entity-card" *ngFor="let s of filtrar(estado.data)">
        <div class="card-image">
          <img *ngIf="s.imagenUrl" [src]="s.imagenUrl" (error)="s.imagenUrl = ''" [alt]="s.nombre" />
          <div *ngIf="!s.imagenUrl" class="card-image-placeholder">
            <i data-lucide="sparkles"></i>
          </div>
        </div>
        <div class="card-body">
          <h3 class="card-title">{{ s.nombre }}</h3>
          <p class="card-text">{{ s.descripcion || 'Sin descripción' }}</p>
          <div class="card-meta">
            <span class="meta-item"><i data-lucide="clock"></i> {{ s.duracion }} min</span>
            <span class="meta-item price">${{ s.precio | number:'1.2-2' }}</span>
          </div>
        </div>
        <div class="card-actions">
          <button type="button" (click)="abrirModalEditar(s)" class="btn btn-ghost btn-sm">
            <i data-lucide="pencil"></i> Editar
          </button>
          <button type="button" (click)="eliminar(s)" class="btn btn-danger btn-sm">
            <i data-lucide="trash-2"></i> Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL CREAR -->
<div *ngIf="modalCrearAbierto" class="overlay" (click)="cerrarModalCrear()">
  <div class="modal" (click)="$event.stopPropagation()">
    <app-admin-servicios-crear
      (servicioCreado)="recargarLista(); cerrarModalCrear()"
      (cancelar)="cerrarModalCrear()">
    </app-admin-servicios-crear>
  </div>
</div>

<!-- MODAL EDITAR -->
<div *ngIf="modalEditarAbierto" class="overlay" (click)="cerrarModalEditar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <app-admin-servicios-editar
      [servicio]="servicioSeleccionado"
      (servicioEditado)="recargarLista(); cerrarModalEditar()"
      (cancelar)="cerrarModalEditar()">
    </app-admin-servicios-editar>
  </div>
</div>
