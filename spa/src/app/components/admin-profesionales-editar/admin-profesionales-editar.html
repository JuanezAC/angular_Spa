<h2>Editar Profesional</h2>
<form (ngSubmit)="guardarCambios()">
  <div class="campo"><label>Nombre</label><input name="nombre" [(ngModel)]="profesionalEditando.nombre" required /></div>
  <div class="campo"><label>Especialidad</label><input name="especialidad" [(ngModel)]="profesionalEditando.especialidad" required /></div>
  <div class="campo"><label>Correo</label><input name="correo" type="email" [(ngModel)]="profesionalEditando.correo" required /></div>
  <div class="campo"><label>Teléfono</label><input name="telefono" [(ngModel)]="profesionalEditando.telefono" required /></div>
  <div class="campo checkbox">
    <label><input type="checkbox" [(ngModel)]="profesionalEditando.activo" name="activo" /> Activo</label>
  </div>

  <!-- ✅ LISTA DE SERVICIOS -->
  <div class="campo">
    <label>Servicios asignados</label>
    <div class="servicios-lista">
      <label *ngFor="let s of serviciosDisponibles" class="servicio-item">
        <input type="checkbox" [checked]="serviciosSeleccionados.includes(s.id!)" (change)="toggleServicio(s.id!)">
        <span>{{ s.nombre }} ({{ s.duracion }} min)</span>
      </label>
    </div>
  </div>

  <div class="acciones">
    <button type="submit">Actualizar</button>
    <button type="button" (click)="cerrar()">Cancelar</button>
  </div>
</form>
